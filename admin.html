<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos Genesis - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }

        .section-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: #0369a1;
        }

        #status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Cosmos Genesis - Admin Panel</h1>
        
        <form id="admin-form">
            <div class="section-box">
                <h3>Main Settings</h3>
                <div class="input-group">
                    <label>Background Video URL (Raw MP4)</label>
                    <input type="text" id="bg-video-input" required>
                </div>
                <div class="input-group">
                    <label>Logo URL (Raw PNG)</label>
                    <input type="text" id="logo-input" required>
                </div>
            </div>

            <div id="links-form-container"></div>

            <button type="submit" class="save-btn">Save Changes to Cloud</button>
            <div id="status-msg"></div>
        </form>
    </div>

    <script>
        const BIN_ID = "6aae87cbac6210605adfc8fc";
        const API_KEY = "$2a$10$Gd1pKq9Z6WI5F4uRk496UubcSkwJTAznwMcQEDYBgiSRCDyzaYLw";

        const bgVideoInput = document.getElementById('bg-video-input');
        const logoInput = document.getElementById('logo-input');
        const linksFormContainer = document.getElementById('links-form-container');
        const statusMsg = document.getElementById('status-msg');

        async function fetchAdminData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                const result = await response.json();
                const data = result.record;

                bgVideoInput.value = data.bgVideo || '';
                logoInput.value = data.logoUrl || '';

                linksFormContainer.innerHTML = '';
                if (data.links && Array.isArray(data.links)) {
                    data.links.forEach((link, index) => {
                        linksFormContainer.innerHTML += `
                            <div class="section-box">
                                <h3>Link Card ${index + 1}</h3>
                                <div class="input-group">
                                    <label>Title</label>
                                    <input type="text" class="link-title" value="${link.title}" required>
                                </div>
                                <div class="input-group">
                                    <label>Destination URL</label>
                                    <input type="text" class="link-url" value="${link.url}" required>
                                </div>
                                <div class="input-group">
                                    <label>Icon URL (Raw PNG)</label>
                                    <input type="text" class="link-icon" value="${link.icon}" required>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                statusMsg.style.color = '#ef4444';
                statusMsg.textContent = 'Error loading data from cloud!';
            }
        }

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMsg.style.color = '#38bdf8';
            statusMsg.textContent = 'Saving to cloud...';

            const titleInputs = document.querySelectorAll('.link-title');
            const urlInputs = document.querySelectorAll('.link-url');
            const iconInputs = document.querySelectorAll('.link-icon');

            const updatedLinks = [];
            for (let i = 0; i < titleInputs.length; i++) {
                updatedLinks.push({
                    title: titleInputs[i].value,
                    url: urlInputs[i].value,
                    icon: iconInputs[i].value
                });
            }

            const payload = {
                bgVideo: bgVideoInput.value,
                logoUrl: logoInput.value,
                links: updatedLinks
            };

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusMsg.style.color = '#22c55e';
                    statusMsg.textContent = 'Changes saved successfully!';
                } else {
                    throw new Error('Save failed');
                }
            } catch (error) {
                statusMsg.style.color = '#ef4444';
                statusMsg.textContent = 'Error saving data!';
            }
        });

        fetchAdminData();
    </script>
</body>
</html>
