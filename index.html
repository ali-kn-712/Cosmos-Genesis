<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos Genesis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background: #111;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 50px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .link-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .link-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/16800960%201920%201080%2024fps(1).mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/Cosmos%20Genesis%20Logo%20With%20Black%20Circle%20BG.png" alt="Logo">
        </div>

        <div class="links-list">
            <a href="https://www.youtube.com/@CosmosGenesis" class="link-card" target="_blank" rel="noopener noreferrer">
                <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/YT%20-%20Circle.png" alt="YouTube" class="link-icon">
                <span class="link-title">YouTube Channel</span>
            </a>
            <a href="https://www.instagram.com/cosmos_genesis/" class="link-card" target="_blank" rel="noopener noreferrer">
                <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/IG%20-%20Circle.png" alt="Instagram" class="link-icon">
                <span class="link-title">Instagram Page</span>
            </a>
            <a href="https://twitter.com/AliknspaceR" class="link-card" target="_blank" rel="noopener noreferrer">
                <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/X%20-%20Circle.png" alt="X" class="link-icon">
                <span class="link-title">X Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
