<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos Genesis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Slider Styling with Fade Effect */
        .bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #0b0f19;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4);
            opacity: 0;
            /* Transition set to 3 seconds for smooth fading */
            transition: opacity 3s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Glassmorphism Logo Container */
        .logo-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 50px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .link-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .link-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <!-- Background Slider Container -->
    <div class="bg-slider" id="slider"></div>

    <div class="container">
        <!-- Brand Logo -->
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/Cosmos%20Genesis%20Logo%20With%20Black%20Circle%20BG.png" alt="Logo">
        </div>
        
        <!-- Brand Name -->
        <h1 class="brand-title">Cosmos Genesis</h1>

        <!-- Social Links List -->
        <div class="links-list">
            <a href="https://www.youtube.com/@https://www.youtube.com/channel/UCxGNtMi_cJDLrhdA0ckl5aQ?sub_confirmation=1" class="link-card" target="_blank" rel="noopener noreferrer">
                <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/YT%20-%20Circle.png" alt="YouTube" class="link-icon">
                <span class="link-title">YouTube Channel</span>
            </a>
            <a href="https://www.instagram.com/cosmos_genesis/" class="link-card" target="_blank" rel="noopener noreferrer">
                <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/IG%20-%20Circle.png" alt="Instagram" class="link-icon">
                <span class="link-title">Instagram Page</span>
            </a>
            <a href="https://twitter.com/AliknspaceR" class="link-card" target="_blank" rel="noopener noreferrer">
                <img src="https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/main/X%20-%20Circle.png" alt="X" class="link-icon">
                <span class="link-title">X Profile</span>
            </a>
        </div>
    </div>

    <script>
        // You can add 10 or more background image raw URLs inside this array.
        // Separate each URL with a comma.
        const backgroundImages = [
            "github.com/ali-kn-712/Cosmos-Genesis/blob/main/1111111111111111111111.jpg?raw=true",
            "https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/refs/heads/main/20250826_004333.jpg",
            "https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/refs/heads/main/20250906_194458.jpg",
            "https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/refs/heads/main/52634851277_009638fba9_k.jpg",
            "https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/refs/heads/main/52723752377_4c4428f711_k.jpg",
            "https://raw.githubusercontent.com/ali-kn-712/Cosmos-Genesis/refs/heads/main/fh%20launch.jpg"
        ];

        const sliderContainer = document.getElementById('slider');
        let currentIndex = 0;

        // Dynamically create image elements for the slider
        backgroundImages.forEach((url, index) => {
            const img = document.createElement('img');
            img.src = url;
            img.className = `bg-slide ${index === 0 ? 'active' : ''}`;
            sliderContainer.appendChild(img);
        });

        const slides = document.querySelectorAll('.bg-slide');

        // Automatically change the background image every 5 seconds with fade effect
        setInterval(() => {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
        }, 5000);
    </script>
</body>
</html>
