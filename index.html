<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos Genesis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background: #111;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 50px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .link-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .link-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="" type="video/mp4">
        Your browser does not support video playback.
    </video>

    <div class="container">
        <div class="logo-container">
            <img id="main-logo" src="" alt="Logo">
        </div>

        <div id="links-container" class="links-list"></div>
    </div>

    <script>
        const BIN_ID = "6aae87cbac6210605adfc8fc";
        const API_KEY = "$2a$10$Gd1pKq9Z6WI5F4uRk496UubcSkwJTAznwMcQEDYBgiSRCDyzaYLw";

        async function loadSiteData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                const result = await response.json();
                const data = result.record;

                const videoElement = document.getElementById('bg-video');
                const sourceElement = videoElement.querySelector('source');
                if (data.bgVideo) {
                    sourceElement.src = data.bgVideo;
                    videoElement.load();
                }

                if (data.logoUrl) {
                    document.getElementById('main-logo').src = data.logoUrl;
                }

                const container = document.getElementById('links-container');
                container.innerHTML = '';

                if (data.links && Array.isArray(data.links)) {
                    data.links.forEach(link => {
                        const a = document.createElement('a');
                        a.href = link.url;
                        a.className = 'link-card';
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';

                        a.innerHTML = `
                            <img src="${link.icon}" alt="${link.title}" class="link-icon">
                            <span class="link-title">${link.title}</span>
                        `;
                        container.appendChild(a);
                    });
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        loadSiteData();
    </script>
</body>
